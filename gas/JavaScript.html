<script>
  const storage = window.localStorage;
  const state = {
    studentToken: storage.getItem('santaStudentToken'),
    teacherToken: storage.getItem('santaTeacherToken'),
    sound: storage.getItem('santaSound') !== 'off',
    student: null, progress: null, ranking: [], students: [], questions: [], questionStatus: null,
    question: null, lastAnswer: '', currentStage: 1, reviewMode: false, reviewCorrectIds: [], pendingClear: null, sending: false, questionPrefetch: null
  };
  const $ = (id) => document.getElementById(id);
  const views = ['loginView','teacherLoginView','studentView','playView','stageClearView','endingView','teacherView'];

  function callServer(name, ...args) {
    return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
  }
  function showView(id) { views.forEach((view) => $(view).classList.toggle('hidden', view !== id)); window.scrollTo(0, 0); }
  function busy(on) { $('loading').classList.toggle('hidden', !on); }
  function toast(message, error) { const el=$('toast'); el.textContent=message; el.className='toast'+(error?' error':''); clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.classList.add('hidden'),4000); }
  function escapeHtml(value) { return String(value == null ? '' : value).replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char])); }
  function isSessionError(message) { return /有効期限|別の端末でログイン/.test(String(message || '')); }
  function handleError(error) { console.error(error); toast('通信に失敗しました。時間をおいて再度お試しください。', true); }
  function santaImage(level) { return SANTA_IMAGES[Math.max(0, Math.min(8, Number(level) || 0))] || SANTA_IMAGES[0] || ''; }

  let audioContext;
  function syncSoundButtons() {
    ['soundToggle','playSoundToggle'].forEach((id)=>{ if($(id)){ $(id).textContent=state.sound?'♪ 音あり':'♪ 消音'; $(id).setAttribute('aria-pressed',String(state.sound)); }});
  }
  function toggleSound(){state.sound=!state.sound;storage.setItem('santaSound',state.sound?'on':'off');syncSoundButtons();if(state.sound)prepareSound()}
  function prepareSound(){try{const AudioContext=window.AudioContext||window.webkitAudioContext;if(AudioContext&&!audioContext)audioContext=new AudioContext();if(audioContext&&audioContext.state==='suspended')audioContext.resume()}catch(error){console.warn(error)}}
  function playNotes(notes,type){if(!state.sound)return;try{prepareSound();if(!audioContext)return;notes.forEach((note,index)=>{const oscillator=audioContext.createOscillator(),gain=audioContext.createGain(),start=audioContext.currentTime+index*.13;oscillator.type=type||'sine';oscillator.frequency.value=note;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.14,start+.02);gain.gain.exponentialRampToValueAtTime(.0001,start+.28);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(start);oscillator.stop(start+.3)})}catch(error){console.warn(error)}}
  function showAnswerFeedback(correct){const box=$('answerFeedback');$('answerFeedbackMark').textContent=correct?'〇':'×';box.className='answer-feedback '+(correct?'correct':'incorrect');void box.offsetWidth;box.classList.add('show');playNotes(correct?[523,659,784]:[220,165],correct?'sine':'sawtooth');setTimeout(()=>box.classList.add('hidden'),900)}
  function createConfetti(id){const colors=['#f5cd64','#e23a4e','#5dbb9d','#ffffff'];$(id).innerHTML=Array.from({length:54},(_,i)=>'<i style="--x:'+((i*37)%100)+'%;--delay:'+((i%12)*.11)+'s;--duration:'+(2.8+(i%7)*.22)+'s;--color:'+colors[i%colors.length]+';--turn:'+((i%2?1:-1)*(180+i*17))+'deg"></i>').join('')}

  async function initialize(){syncSoundButtons();if(state.studentToken){busy(true);try{const result=await callServer('resumeStudentSession',state.studentToken);if(result.success){enterStudent(result);return}storage.removeItem('santaStudentToken');state.studentToken=null}catch(error){handleError(error)}finally{busy(false)}}if(state.teacherToken){await loadTeacherDashboard();if(state.teacherToken)return}showView('loginView')}

  $('showTeacherLogin').addEventListener('click',()=>showView('teacherLoginView'));
  $('backToStudentLogin').addEventListener('click',()=>showView('loginView'));
  $('soundToggle').addEventListener('click',toggleSound);$('playSoundToggle').addEventListener('click',toggleSound);

  $('studentLoginForm').addEventListener('submit',async(event)=>{event.preventDefault();busy(true);try{const result=await callServer('loginStudent',$('studentId').value,$('studentPassword').value);if(!result.success)return toast(result.message,true);state.studentToken=result.token;storage.setItem('santaStudentToken',result.token);enterStudent(result)}catch(error){handleError(error)}finally{busy(false)}});
  function enterStudent(result){state.student=result.student;state.progress=result.progress;state.ranking=result.ranking||[];$('studentName').textContent=result.student.name+'さん';$('nicknameInput').value=result.student.nickname||'';renderStudentHome();showView('studentView')}
  function renderStudentHome(){const p=state.progress;$('santaImage').src=santaImage(p.completedStages);$('completedStages').textContent=p.completedStages+' / 8';$('overallProgress').textContent=p.totalCorrect+' / 80';$('overallPercent').textContent=p.percentage+'%';$('overallFill').style.width=p.percentage+'%';if(p.completed){$('progressHeadline').textContent='クリスマス準備、完成！';$('progressMessage').textContent='80問完全制覇です。クリア済みステージを復習できます。'}else{$('progressHeadline').textContent='ステージ'+p.currentStage+'に挑戦しよう！';$('progressMessage').textContent='次は「'+p.stageStates[p.currentStage-1].item+'」を準備します。'}renderStageGrid();renderRanking(state.ranking)}
  function renderStageGrid(){const icons=['♟','◆','▰','▣','●','★','▰','✦'];$('stageGrid').innerHTML=state.progress.stageStates.map((stage)=>{let cls='stage-card',status='🔒',action='まだ遊べません';if(stage.completed){cls+=' complete';status='✓';action='復習する'}else if(stage.current){cls+=' current';status='→';action='挑戦する'}else{cls+=' locked'}return '<button class="'+cls+'" data-stage="'+stage.stage+'" '+(stage.unlocked?'':'disabled')+'><span class="stage-number">STAGE '+stage.stage+'</span><span class="stage-status">'+status+'</span><span class="stage-icon">'+icons[stage.stage-1]+'</span><strong>'+escapeHtml(stage.item)+'</strong><small>'+stage.count+' / 10問・'+action+'</small></button>'}).join('')}
  $('stageGrid').addEventListener('click',(event)=>{const button=event.target.closest('[data-stage]');if(!button)return;const stage=Number(button.dataset.stage);startStage(stage,state.progress.stageStates[stage-1].completed)});
  async function startStage(stage,review){state.questionPrefetch=null;state.currentStage=stage;state.reviewMode=Boolean(review);state.reviewCorrectIds=[];state.pendingClear=null;$('playModeLabel').textContent=review?'復習モード':'挑戦中';$('playStageTitle').textContent='ステージ'+stage+'「'+state.progress.stageStates[stage-1].item+'」';showView('playView');await loadQuestion('')}
  function resetQuestionCard(){$('questionCard').classList.remove('hidden');$('answerForm').classList.remove('hidden');$('resultBox').className='result-box hidden';$('retryBox').classList.add('hidden');$('answerInput').value='';state.lastAnswer='';state.sending=false;$('answerButton').disabled=false;document.querySelectorAll('.choice-button.selected').forEach((button)=>button.classList.remove('selected'))}
  function renderAnswerControls(question){const type=question.type||'記述';$('textAnswerArea').classList.toggle('hidden',type!=='記述');$('oxAnswerArea').classList.toggle('hidden',type!=='〇×');$('choiceAnswerArea').classList.toggle('hidden',type!=='4択');$('answerButton').classList.toggle('hidden',type!=='記述');$('answerInput').required=type==='記述';if(type==='4択'){const labels=['ア','イ','ウ','エ'];$('choiceAnswerArea').innerHTML=(question.choices||[]).map((choice,index)=>'<button type="button" class="choice-button" data-answer="'+escapeHtml(choice)+'"><span class="choice-label">'+labels[index]+'</span><span class="choice-text">'+escapeHtml(choice)+'</span></button>').join('')}else{$('choiceAnswerArea').innerHTML=''} }
  function questionRequest(exclude){return callServer('getStageQuestion',state.studentToken,state.currentStage,exclude||'',state.reviewCorrectIds,state.reviewMode)}
  async function loadQuestion(exclude){busy(true);resetQuestionCard();const key=exclude||'';const prefetch=state.questionPrefetch;state.questionPrefetch=null;try{let result=null;if(prefetch&&prefetch.stage===state.currentStage&&prefetch.review===state.reviewMode&&prefetch.exclude===key){try{result=await prefetch.request}catch(error){result=null}}if(!result)result=await questionRequest(key);if(!result.success){if(isSessionError(result.message))return forceStudentLogout(result.message);return toast(result.message,true)}state.progress=result.progress;if(result.stageFinished){if(state.reviewMode){toast('ステージ'+state.currentStage+'の復習が完了しました！');await refreshStudentHome();showView('studentView')}else{await refreshStudentHome();showView('studentView')}return}state.question=result.question;$('questionNumber').textContent='STAGE '+result.question.stage+'・QUESTION '+result.question.number;$('questionText').textContent=result.question.text;renderAnswerControls(result.question);updatePlayProgress();if((result.question.type||'記述')==='記述')setTimeout(()=>$('answerInput').focus(),0)}catch(error){handleError(error)}finally{busy(false)}}
  function updatePlayProgress(){const count=state.reviewMode?state.reviewCorrectIds.length:state.progress.stageStates[state.currentStage-1].count;$('stageProgressText').textContent=count+' / 10問';$('stageProgressFill').style.width=(count*10)+'%';$('playOverallText').textContent=state.reviewMode?'復習中':'全体 '+state.progress.totalCorrect+' / 80問'}
  $('answerForm').addEventListener('submit',async(event)=>{event.preventDefault();if((state.question&&state.question.type||'記述')!=='記述')return;state.lastAnswer=$('answerInput').value;await sendAnswer()});
  $('oxAnswerArea').addEventListener('click',(event)=>{const button=event.target.closest('[data-answer]');if(!button||state.sending)return;document.querySelectorAll('#oxAnswerArea .choice-button').forEach((item)=>item.classList.toggle('selected',item===button));state.lastAnswer=button.getAttribute('data-answer');sendAnswer()});
  $('choiceAnswerArea').addEventListener('click',(event)=>{const button=event.target.closest('[data-answer]');if(!button||state.sending)return;document.querySelectorAll('#choiceAnswerArea .choice-button').forEach((item)=>item.classList.toggle('selected',item===button));state.lastAnswer=button.getAttribute('data-answer');sendAnswer()});
  $('retryAnswer').addEventListener('click',sendAnswer);
  function showPendingJudgement(){$('answerForm').classList.add('hidden');$('retryBox').classList.add('hidden');$('resultBox').className='result-box pending';$('resultTitle').textContent='判定中…';$('correctAnswer').textContent='';$('explanation').textContent='';$('nextQuestion').classList.add('hidden')}
  function showSendRetry(message){state.sending=false;$('answerButton').disabled=false;$('resultBox').className='result-box hidden';$('answerForm').classList.remove('hidden');$('retryMessage').textContent=message;$('retryBox').classList.remove('hidden')}
  async function sendAnswer(){if(!state.question||state.sending)return;state.sending=true;$('answerButton').disabled=true;showPendingJudgement();try{const result=await callServer('submitAnswer',state.studentToken,state.question.id,state.lastAnswer,state.reviewMode);if(!result.success){if(isSessionError(result.message))return forceStudentLogout(result.message);return showSendRetry(result.message)}if(result.correct&&state.reviewMode&&!state.reviewCorrectIds.includes(result.questionId))state.reviewCorrectIds.push(result.questionId);if(result.progress)state.progress=result.progress;state.pendingClear=result.stageCleared?result:null;$('resultBox').className='result-box '+(result.correct?'':'incorrect');$('resultTitle').textContent=result.correct?'正解！':'不正解';$('correctAnswer').textContent=result.correct?'正解として記録しました。':'正解：'+result.correctAnswer;$('explanation').textContent=result.explanation?'解説：'+result.explanation:'';$('nextQuestion').classList.remove('hidden');$('nextQuestion').textContent=result.stageCleared?'ステージクリアへ':'次の問題へ';$('nextQuestion').dataset.exclude=result.correct?'':state.question.id;updatePlayProgress();showAnswerFeedback(result.correct);if(!result.stageCleared){const exclude=result.correct?'':state.question.id;state.questionPrefetch={stage:state.currentStage,review:state.reviewMode,exclude:exclude,request:questionRequest(exclude)}}}catch(error){showSendRetry('通信に失敗しました。同じ回答を再送してください。')}}
  $('nextQuestion').addEventListener('click',()=>{if(state.pendingClear)return showStageClear(state.pendingClear);loadQuestion($('nextQuestion').dataset.exclude||'')});
  $('backToMap').addEventListener('click',async()=>{await refreshStudentHome();showView('studentView')});
  async function refreshStudentHome(){const result=await callServer('getStudentHome',state.studentToken);if(!result.success){if(isSessionError(result.message))return forceStudentLogout(result.message);throw new Error(result.message)}state.student=result.student;state.progress=result.progress;state.ranking=result.ranking||[];renderStudentHome()}
  function showStageClear(result){const cleared=result.progress.completedStages;$('clearTitle').textContent='ステージ'+cleared+' クリア！';$('clearSantaImage').src=santaImage(cleared);$('unlockedItem').textContent=result.unlockedItem+'を手に入れた！';$('clearMessage').textContent=cleared===8?'サンタのクリスマス準備が完成しました。':'サンタの準備が一歩進みました。';$('clearNextStage').textContent=cleared===8?'ゲームクリアへ':'次のステージへ';createConfetti('stageConfetti');playNotes([523,659,784,1047],'triangle');showView('stageClearView')}
  $('clearToMap').addEventListener('click',async()=>{await refreshStudentHome();showView('studentView')});$('clearNextStage').addEventListener('click',async()=>{if(state.progress.completed)return showEnding(state.pendingClear&&state.pendingClear.completion);await refreshStudentHome();startStage(state.progress.currentStage,false)});
  function showEnding(details){const info=details||{};$('endingSantaImage').src=santaImage(8);$('certificateNickname').textContent=info.nickname||state.student.nickname||'冒険者';$('certificateDate').textContent=info.completedDate||'今日';$('certificateRank').textContent=info.rank?'ランキング 第'+info.rank+'位':'ニックネーム設定後に順位を表示';createConfetti('endingConfetti');playNotes([262,330,392,523,659,784,1047],'triangle');showView('endingView')}
  $('endingToMap').addEventListener('click',async()=>{await refreshStudentHome();showView('studentView')});
  $('nicknameForm').addEventListener('submit',async(event)=>{event.preventDefault();busy(true);try{const result=await callServer('saveStudentNickname',state.studentToken,$('nicknameInput').value);if(!result.success)return toast(result.message,true);state.student.nickname=result.nickname;state.ranking=result.ranking;renderRanking(result.ranking);toast('ニックネームを設定しました。')}catch(error){handleError(error)}finally{busy(false)}});
  function renderRanking(ranking){$('rankingEmpty').classList.toggle('hidden',ranking.length>0);$('rankingList').innerHTML=ranking.map((entry)=>'<li class="'+(entry.isCurrent?'current':'')+'"><span class="rank-badge">'+entry.rank+'</span><strong>'+escapeHtml(entry.nickname)+(entry.isCurrent?'（あなた）':'')+'<small>ステージ'+entry.currentStage+(entry.completedStages===8?'・完全制覇':'挑戦中')+'</small></strong><span>'+entry.correctCount+' / 80問</span></li>').join('')}
  $('studentLogout').addEventListener('click',studentLogout);async function studentLogout(){const token=state.studentToken;state.studentToken=null;storage.removeItem('santaStudentToken');showView('loginView');if(token)callServer('logoutStudent',token)}function forceStudentLogout(message){state.studentToken=null;storage.removeItem('santaStudentToken');showView('loginView');toast(message,true)}

  $('teacherLoginForm').addEventListener('submit',async(event)=>{event.preventDefault();busy(true);try{const result=await callServer('loginTeacher',$('teacherPassword').value);if(!result.success)return toast(result.message,true);state.teacherToken=result.token;storage.setItem('santaTeacherToken',result.token);await loadTeacherDashboard()}catch(error){handleError(error)}finally{busy(false)}});
  async function loadTeacherDashboard(){busy(true);try{const result=await callServer('getTeacherDashboard',state.teacherToken);if(!result.success){storage.removeItem('santaTeacherToken');state.teacherToken=null;showView('teacherLoginView');return toast(result.message,true)}state.students=result.students;state.questions=result.questions;state.questionStatus=result.questionStatus;renderTeacher();showView('teacherView')}catch(error){handleError(error)}finally{busy(false)}}
  function renderTeacher(){const completed=state.students.filter((student)=>student.completed).length;$('totalStudents').textContent=state.students.length;$('completedStudents').textContent=completed;$('activeStudents').textContent=state.students.length-completed;const published=state.questions.filter((question)=>question.published).length;$('publishedQuestions').textContent=published+' / 80';$('questionWarning').classList.toggle('hidden',state.questionStatus.valid);$('questionWarning').textContent=state.questionStatus.valid?'':'公開前チェック：'+state.questionStatus.errors.join(' / ');renderStudents();renderQuestions();$('stageValidation').innerHTML=state.questionStatus.stages.map((stage)=>'<div class="stage-check '+(stage.ready?'ready':'')+'">ステージ'+stage.stage+'：'+stage.count+' / 10問 '+(stage.ready?'✓':'要確認')+'</div>').join('')}
  function renderStudents(){const query=$('studentSearch').value.trim().toLowerCase(),incomplete=$('incompleteOnly').checked;const rows=state.students.filter((student)=>(!incomplete||!student.completed)&&(!query||(student.id+' '+student.name+' '+student.className).toLowerCase().includes(query)));$('studentTableBody').innerHTML=rows.map((student)=>'<tr><td><strong>'+escapeHtml(student.name)+'</strong><br><small>'+escapeHtml(student.id)+'</small></td><td>'+escapeHtml(student.className)+' '+escapeHtml(student.number)+'</td><td><span class="badge '+(student.completed?'complete':'')+'">'+(student.completed?'完全制覇':'ステージ'+student.currentStage)+'</span></td><td>'+student.correctCount+' / 80</td><td>'+(student.loggedIn?'<span class="badge login">ログイン中</span>':'—')+'</td><td><div class="actions"><button class="mini-button" data-student-action="edit" data-id="'+escapeHtml(student.id)+'">編集</button><button class="mini-button" data-student-action="unanswered" data-id="'+escapeHtml(student.id)+'">未正解</button><button class="mini-button" data-student-action="password" data-id="'+escapeHtml(student.id)+'">再発行</button>'+(student.loggedIn?'<button class="mini-button" data-student-action="release" data-id="'+escapeHtml(student.id)+'">解除</button>':'')+'<button class="mini-button danger" data-student-action="reset" data-id="'+escapeHtml(student.id)+'">リセット</button><button class="mini-button danger" data-student-action="delete" data-id="'+escapeHtml(student.id)+'">削除</button></div></td></tr>').join('')}
  function renderQuestions(){const filter=$('questionStageFilter').value;const rows=state.questions.filter((question)=>filter==='all'||question.stage===Number(filter)).sort((a,b)=>a.stage-b.stage||a.number-b.number);$('questionTableBody').innerHTML=rows.map((question)=>'<tr><td>ステージ'+question.stage+'</td><td>'+question.number+'</td><td>'+escapeHtml(question.type||'記述')+'</td><td><strong>'+escapeHtml(question.text)+'</strong><br><small>ID: '+escapeHtml(question.id)+'</small></td><td>'+escapeHtml(question.answer)+'</td><td><span class="badge '+(question.published?'complete':'draft')+'">'+(question.published?'公開':'下書き')+'</span></td><td><div class="actions"><button class="mini-button" data-question-action="edit" data-id="'+escapeHtml(question.id)+'">編集</button><button class="mini-button danger" data-question-action="delete" data-id="'+escapeHtml(question.id)+'">削除</button></div></td></tr>').join('')}
  $('studentSearch').addEventListener('input',renderStudents);$('incompleteOnly').addEventListener('change',renderStudents);$('questionStageFilter').addEventListener('change',renderQuestions);
  document.querySelectorAll('.admin-tabs button').forEach((button)=>button.addEventListener('click',()=>{document.querySelectorAll('.admin-tabs button').forEach((item)=>item.classList.toggle('active',item===button));$('studentsTab').classList.toggle('hidden',button.dataset.tab!=='students');$('questionsTab').classList.toggle('hidden',button.dataset.tab!=='questions')}));
  function openModal(title,html){$('modalTitle').textContent=title;$('modalContent').innerHTML=html;$('modal').showModal()}function closeModal(){$('modal').close()}$('closeModal').addEventListener('click',closeModal);
  function studentForm(student){const item=student||{};openModal(student?'生徒情報を編集':'生徒を追加','<form id="studentEditForm"><div class="form-grid"><label>生徒ID<input name="id" value="'+escapeHtml(item.id||'')+'" '+(student?'readonly':'')+' required></label><label>パスワード<input name="password" value="'+escapeHtml(item.password||'')+'" required></label><label>氏名<input name="name" value="'+escapeHtml(item.name||'')+'" required></label><label>クラス<input name="className" value="'+escapeHtml(item.className||'')+'"></label><label>出席番号<input name="number" value="'+escapeHtml(item.number||'')+'"></label><label>Googleアカウント<input name="googleAccount" value="'+escapeHtml(item.googleAccount||'')+'"></label><label class="full">ニックネーム<input name="nickname" value="'+escapeHtml(item.nickname||'')+'" maxlength="20"></label></div><div class="modal-actions"><button type="button" class="button secondary" data-close>キャンセル</button><button class="button primary" type="submit">保存</button></div></form>');$('[data-close]').addEventListener('click',closeModal);$('studentEditForm').addEventListener('submit',async(event)=>{event.preventDefault();const form=new FormData(event.target),data=Object.fromEntries(form.entries());data.isNew=!student;busy(true);try{const result=await callServer('saveStudent',state.teacherToken,data);if(!result.success)return toast(result.message,true);closeModal();await loadTeacherDashboard();toast('生徒情報を保存しました。')}catch(error){handleError(error)}finally{busy(false)}})}
  $('addStudent').addEventListener('click',()=>studentForm(null));
  $('importStudentsButton').addEventListener('click',()=>{openModal('生徒を一括登録','<p>スプレッドシートから「生徒ID、パスワード、氏名、クラス、出席番号、Googleアカウント、ニックネーム」の順にコピーして貼り付けてください。</p><textarea id="importText" placeholder="生徒ID&#9;パスワード&#9;氏名..." style="width:100%;min-height:220px"></textarea><div class="modal-actions"><button class="button primary" id="runImport">登録する</button></div>');$('runImport').addEventListener('click',async()=>{busy(true);try{const result=await callServer('importStudents',state.teacherToken,$('importText').value);if(!result.success)return toast(result.message,true);closeModal();await loadTeacherDashboard();toast('追加'+result.added+'名、更新'+result.updated+'名を登録しました。')}catch(error){handleError(error)}finally{busy(false)}})});
  $('studentTableBody').addEventListener('click',async(event)=>{const button=event.target.closest('[data-student-action]');if(!button)return;const student=state.students.find((item)=>item.id===button.dataset.id),action=button.dataset.studentAction;if(action==='edit')return studentForm(student);if(action==='unanswered'){busy(true);try{const result=await callServer('getUnansweredQuestions',state.teacherToken,student.id);if(!result.success)return toast(result.message,true);openModal(student.name+'さんの未正解問題','<ol class="question-list">'+result.questions.map((q)=>'<li><strong>S'+q.stage+'-'+q.number+'</strong>'+escapeHtml(q.text)+'</li>').join('')+'</ol>')}finally{busy(false)}return}if(action==='password'){if(!confirm(student.name+'さんのパスワードを再発行しますか？'))return;const result=await callServer('reissueStudentPassword',state.teacherToken,student.id);if(result.success){openModal('新しいパスワード','<p class="new-password">'+escapeHtml(result.password)+'</p>');await loadTeacherDashboard()}else toast(result.message,true);return}const labels={release:'ログインセッションを解除',reset:'学習進捗をすべてリセット',delete:'生徒情報と学習記録を削除'};if(!confirm(student.name+'さんの'+labels[action]+'しますか？'))return;busy(true);try{const method={release:'releaseStudentSession',reset:'resetStudentProgress',delete:'deleteStudent'}[action];const result=await callServer(method,state.teacherToken,student.id);if(!result.success)return toast(result.message,true);await loadTeacherDashboard();toast('操作が完了しました。')}finally{busy(false)}});
  function syncQuestionFormFields(){const type=$('questionType').value;$('textAnswerFields').classList.toggle('hidden',type!=='記述');$('oxAnswerFields').classList.toggle('hidden',type!=='〇×');$('choiceAnswerFields').classList.toggle('hidden',type!=='4択');$('alternativesField').classList.toggle('hidden',type==='4択');$('textAnswerInput').required=type==='記述';$('oxAnswerSelect').required=type==='〇×';['choice1','choice2','choice3','choice4'].forEach((name)=>{const input=document.querySelector('[name="'+name+'"]');if(input)input.required=type==='4択'})}
  function questionForm(question){const item=question||{stage:Number($('questionStageFilter').value)||1,number:1,published:false,type:'記述',choices:[]};const type=item.type||'記述';const choices=item.choices&&item.choices.length?item.choices:['','','',''];const oxAnswer=type==='〇×'?(item.answer==='×'?'×':'〇'):'〇';openModal(question?'問題を編集':'問題を追加','<form id="questionEditForm"><div class="form-grid"><label>ステージ<select name="stage">'+Array.from({length:8},(_,i)=>'<option value="'+(i+1)+'" '+(item.stage===i+1?'selected':'')+'>'+(i+1)+'</option>').join('')+'</select></label><label>問題番号<input name="number" type="number" min="1" max="10" value="'+item.number+'" required></label><label class="full">形式<select id="questionType" name="type"><option value="記述" '+(type==='記述'?'selected':'')+'>記述</option><option value="〇×" '+(type==='〇×'?'selected':'')+'>〇×</option><option value="4択" '+(type==='4択'?'selected':'')+'>4択</option></select></label><label class="full">問題文<textarea name="text" required>'+escapeHtml(item.text||'')+'</textarea></label><div id="textAnswerFields" class="full '+(type==='記述'?'':'hidden')+'"><label class="full">正解<input id="textAnswerInput" name="answerText" value="'+(type==='記述'?escapeHtml(item.answer||''):'')+'"></label></div><div id="oxAnswerFields" class="full '+(type==='〇×'?'':'hidden')+'"><label class="full">正解<select id="oxAnswerSelect" name="answerOx"><option value="〇" '+(oxAnswer==='〇'?'selected':'')+'>〇</option><option value="×" '+(oxAnswer==='×'?'selected':'')+'>×</option></select></label></div><div id="choiceAnswerFields" class="full '+(type==='4択'?'':'hidden')+'"><label>選択肢ア<input name="choice1" value="'+escapeHtml(choices[0]||'')+'"></label><label>選択肢イ<input name="choice2" value="'+escapeHtml(choices[1]||'')+'"></label><label>選択肢ウ<input name="choice3" value="'+escapeHtml(choices[2]||'')+'"></label><label>選択肢エ<input name="choice4" value="'+escapeHtml(choices[3]||'')+'"></label><label class="full">正解<select name="answerChoice"><option value="1" '+(type==='4択'&&item.answer===choices[0]?'selected':'')+'>ア</option><option value="2" '+(type==='4択'&&item.answer===choices[1]?'selected':'')+'>イ</option><option value="3" '+(type==='4択'&&item.answer===choices[2]?'selected':'')+'>ウ</option><option value="4" '+(type==='4択'&&item.answer===choices[3]?'selected':'')+'>エ</option></select></label></div><label id="alternativesField" class="full '+(type==='4択'?'hidden':'')+'">別解（改行または | で区切る）<textarea name="alternatives">'+escapeHtml(item.alternatives||'')+'</textarea></label><label class="full">解説<textarea name="explanation">'+escapeHtml(item.explanation||'')+'</textarea></label><label class="full"><span><input name="published" type="checkbox" '+(item.published?'checked':'')+'> 公開する</span></label></div><div class="modal-actions"><button type="button" class="button secondary" data-close>キャンセル</button><button class="button primary" type="submit">保存</button></div></form>');$('[data-close]').addEventListener('click',closeModal);$('questionType').addEventListener('change',syncQuestionFormFields);syncQuestionFormFields();$('questionEditForm').addEventListener('submit',async(event)=>{event.preventDefault();const form=new FormData(event.target);const type=String(form.get('type')||'記述');const choiceList=[form.get('choice1'),form.get('choice2'),form.get('choice3'),form.get('choice4')].map((value)=>String(value||'').trim());let answer='';if(type==='記述')answer=String(form.get('answerText')||'').trim();else if(type==='〇×')answer=String(form.get('answerOx')||'').trim();else answer=choiceList[Number(form.get('answerChoice'))-1]||'';const data={id:item.id||'',stage:form.get('stage'),number:form.get('number'),type:type,text:form.get('text'),answer:answer,alternatives:form.get('alternatives')||'',explanation:form.get('explanation')||'',choices:type==='4択'?choiceList.join('\n'):'',published:form.has('published')};await saveQuestionFromForm(data,false)})}
  async function saveQuestionFromForm(data,confirmImpact){data.confirmImpact=confirmImpact;busy(true);try{const result=await callServer('saveQuestion',state.teacherToken,data);if(result.requiresConfirmation){busy(false);if(confirm(result.message+' 続けますか？'))return saveQuestionFromForm(data,true);return}if(!result.success)return toast(result.message,true);closeModal();await loadTeacherDashboard();toast('問題を保存しました。')}catch(error){handleError(error)}finally{busy(false)}}
  $('addQuestion').addEventListener('click',()=>questionForm(null));$('questionTableBody').addEventListener('click',async(event)=>{const button=event.target.closest('[data-question-action]');if(!button)return;const question=state.questions.find((item)=>item.id===button.dataset.id);if(button.dataset.questionAction==='edit')return questionForm(question);if(!confirm('この問題を削除しますか？'))return;let result=await callServer('deleteQuestion',state.teacherToken,question.id,false);if(result.requiresConfirmation&&confirm(result.message+' 続けますか？'))result=await callServer('deleteQuestion',state.teacherToken,question.id,true);if(result.success){await loadTeacherDashboard();toast('問題を削除しました。')}else if(!result.requiresConfirmation)toast(result.message,true)});
  $('changeTeacherPassword').addEventListener('click',()=>{openModal('教師パスワード変更','<form id="passwordForm"><div class="form-grid"><label class="full">現在のパスワード<input name="current" type="password" required></label><label class="full">新しいパスワード（8文字以上）<input name="next" type="password" minlength="8" required></label></div><div class="modal-actions"><button class="button primary">変更する</button></div></form>');$('passwordForm').addEventListener('submit',async(event)=>{event.preventDefault();const form=new FormData(event.target);const result=await callServer('changeTeacherPassword',state.teacherToken,form.get('current'),form.get('next'));if(!result.success)return toast(result.message,true);closeModal();toast('教師パスワードを変更しました。')})});
  $('teacherLogout').addEventListener('click',()=>{const token=state.teacherToken;state.teacherToken=null;storage.removeItem('santaTeacherToken');showView('teacherLoginView');if(token)callServer('logoutTeacher',token)});
  initialize();
</script>
